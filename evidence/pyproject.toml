[project]
name = "relflow-evidence"
version = "0.1.0"
description = "Controlled empirical evidence and isolated regression gates for RelFlow"
requires-python = ">=3.12"
dependencies = ["pyyaml==6.0.3"]

[project.optional-dependencies]
modal = ["modal==1.6.2"]

[dependency-groups]
dev = ["pytest==9.0.3", "ruff==0.15.14"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "experiments"]
norecursedirs = ["runtime"]

[tool.ruff]
line-length = 120
lint.extend-select = ["I"]

