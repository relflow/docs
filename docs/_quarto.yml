project:
  type: website
  output-dir: site
  pre-render:
    - uv run --project .. python ../proofs/render.py
  resources:
    - assets/fonts/OFL.txt
    - proofs/_generated/results.yaml
    - proofs/_generated/*.py
  render:
    - index.qmd
    - "**/*.qmd"
    - "proofs/*/*.py"

website:
  site-url: https://relflow.github.io/docs/
  title: relflow
  favicon: assets/branding/logos/logo.svg
  image: assets/branding/logos/logo.light.png
  navbar:
    title: relflow
    logo: assets/branding/logos/logo.navbar.svg
    logo-alt: relflow
  sidebar:
    style: floating
    search: false
    collapse-level: 99
    contents:
      - section: Start Here
        contents:
          - href: index.qmd
            text: Overview
          - href: getting-started.qmd
            text: Your First Model
          - href: tutorials/transaction-history.qmd
            text: Add Transaction History
      - section: Work With Data
        contents:
          - href: core-concepts/binding-data.qmd
            text: Binding Data
          - href: core-concepts/data-types.qmd
            text: Choose Field Types
          - href: guides/data-modules.qmd
            text: Data Sources And Splits
          - href: guides/preprocessors.qmd
            text: Preprocessing
      - section: Train And Predict
        contents:
          - href: guides/lightning.qmd
            text: Training And Checkpoints
          - href: guides/evaluation.qmd
            text: Evaluation
          - href: guides/prediction-output.qmd
            text: Read Predictions
          - href: guides/postprocessors.qmd
            text: Postprocessing
          - href: guides/batch-inference.qmd
            text: Batch Inference
      - section: Extend The Transaction Model
        contents:
          - href: guides/learning-from-event-data.qmd
            text: Profile Context And Repeat Payments
          - href: case-studies/customer-risk.qmd
            text: Transaction And Account Outcomes
      - section: Advanced
        contents:
          - section: Model Behavior
            contents:
              - href: core-concepts/dynamic-masking.qmd
                text: Masking And Objectives
              - href: core-concepts/vocabulary.qmd
                text: Online Vocabulary
              - href: core-concepts/jitter.qmd
                text: Jitter
              - href: guides/pretraining.qmd
                text: Pretraining
              - href: core-concepts/embeddings.qmd
                text: Reusable Representations
          - section: Model Design
            contents:
              - href: core-concepts/model-tree.qmd
                text: Structure And Context
              - href: guides/model-templates.qmd
                text: Model Templates
              - href: guides/mechanisms/field-interactions.qmd
                text: Field Interactions
              - href: guides/mechanisms/branch-reduction.qmd
                text: Branch Reduction
              - href: guides/mechanisms/tree-routing.qmd
                text: Tree Routing
              - href: core-concepts/querypaths.qmd
                text: Query Paths
              - href: guides/schema-mutation.qmd
                text: Schema Mutation
              - href: guides/custom-tensorfields.qmd
                text: Custom Tensorfields
          - section: Larger Workflows
            contents:
              - href: guides/performance.qmd
                text: Performance
              - href: guides/serving.qmd
                text: Serving
              - href: case-studies/relational-tasks.qmd
                text: Other Transaction And Event Tasks
      - section: Reference
        contents:
          - section: Common Fields
            contents:
              - href: data-types/number.qmd
                text: Number
              - href: data-types/boolean.qmd
                text: Boolean
              - href: data-types/category.qmd
                text: Category
              - href: data-types/enum.qmd
                text: Enum
              - href: data-types/dateparts.qmd
                text: DateParts
              - href: data-types/branch.qmd
                text: Branch
          - section: Specialized Fields
            contents:
              - href: data-types/hash.qmd
                text: Hash
              - href: data-types/set.qmd
                text: Set
              - href: data-types/text.qmd
                text: Text
              - href: data-types/vector.qmd
                text: Vector
              - href: data-types/quantile.qmd
                text: Quantile
              - href: data-types/cluster.qmd
                text: Cluster
          - href: reference/model-presets.qmd
            text: Model Presets
          - href: reference/public-api.qmd
            text: API Map
          - href: guides/troubleshooting.qmd
            text: Troubleshooting
          - href: proofs.qmd
            text: Proofs
          - href: benchmarks.qmd
            text: Benchmarks
  page-footer:
    border: true
    left: Grantham Taylor
    right:
      - text: GitHub
        icon: github
        href: https://github.com/relflow/relflow
      - text: Discord
        icon: discord
        href: https://discord.gg/DVyZUkvTFA
      - text: LinkedIn
        icon: linkedin
        href: https://www.linkedin.com/in/granthamtaylor
  search: true

format:
  html:
    css:
      - assets/stylesheets/branding.css
      - assets/stylesheets/layout.css
    include-in-header: assets/color-scheme.html
    include-after-body: assets/sidebar.html
    theme:
      light:
        - flatly
        - assets/stylesheets/theme-light.scss
      dark:
        - darkly
        - assets/stylesheets/theme-dark.scss
    toc: false
    code-copy: true
    code-overflow: scroll
    respect-user-color-scheme: true

engine: markdown
execute:
  enabled: false
  eval: false

filters:
  - typst-render
  - path: assets/filters/proof-diagrams.lua
    at: post-quarto
  - path: assets/filters/tables.lua
    # Include evidence tables inserted by proof shortcodes.
    at: post-quarto

extensions:
  typst-render:
    root: /
    format: svg
    background:
      light: none
      dark: "#181c1b"
    output-directory: /assets/diagrams
    preamble: /assets/typst/preamble.typ
