name: Import a selected evidence release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Exact relflow/evidence release tag
        required: true
      sha256:
        description: Reviewed SHA-256 of evidence-docs.tar.gz
        required: true

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Import the pinned report bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release }}
          BUNDLE_SHA256: ${{ inputs.sha256 }}
        run: uv run python scripts/import_evidence.py --release "$RELEASE_TAG" --sha256 "$BUNDLE_SHA256"
      - run: make check check-docs
      - name: Prepare a reviewable snapshot update
        run: |
          git add vendor/evidence contracts/evidence.json
          git diff --cached --binary > evidence-update.patch
          git rev-parse HEAD > docs-base.txt
          tar -czf evidence-snapshot.tar.gz vendor/evidence contracts/evidence.json
          sha256sum evidence-update.patch evidence-snapshot.tar.gz docs-base.txt > SHA256SUMS
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          The selected release passed static validation and the complete rendered-site checks.
          Download `evidence-snapshot-update` for the pinned snapshot, patch, base revision, and checksums.

          In a clean checkout at the recorded docs base, review and apply the patch with
          `git apply --index evidence-update.patch`, then commit it on a branch and open a normal PR.
          An empty patch means the selected snapshot is already imported.
          EOF
      - name: Upload validated snapshot and patch
        uses: actions/upload-artifact@v4
        with:
          name: evidence-snapshot-update
          path: |
            evidence-update.patch
            evidence-snapshot.tar.gz
            docs-base.txt
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Upload rendered review site
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: docs/site
          if-no-files-found: error
          retention-days: 7
