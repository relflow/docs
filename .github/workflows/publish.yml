name: Publish selected evidence reports

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Unique evidence release tag
        required: true
      library_run_id:
        description: Optional library Actions run ID containing a complete relflow-evidence artifact
        required: false

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-evidence-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - name: Download selected library report
        if: inputs.library_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          LIBRARY_RUN_ID: ${{ inputs.library_run_id }}
        run: gh run download "$LIBRARY_RUN_ID" --repo relflow/relflow --name relflow-evidence --dir retained
      - name: Export publication and preserve raw report
        env:
          LIBRARY_RUN_ID: ${{ inputs.library_run_id }}
        run: |
          if [ -n "$LIBRARY_RUN_ID" ]; then
            uv run python export_docs.py export --reports retained --bundle evidence-docs.tar.gz
            uv run python evidence_ci.py bundle retained evidence-reports.tar.gz
            shasum -a 256 evidence-reports.tar.gz > evidence-reports.tar.gz.sha256
          else
            uv run python export_docs.py export --bundle evidence-docs.tar.gz
          fi
      - name: Create draft, attach complete assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "Evidence $RELEASE_TAG" --notes "Pinned experiment sources, recorded measurements, and checksummed documentation export."
          gh release upload "$RELEASE_TAG" evidence-docs.tar.gz evidence-docs.tar.gz.sha256
          if [ -f evidence-reports.tar.gz ]; then
            gh release upload "$RELEASE_TAG" evidence-reports.tar.gz evidence-reports.tar.gz.sha256
          fi
          gh release edit "$RELEASE_TAG" --draft=false

